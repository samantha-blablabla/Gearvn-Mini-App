    <title>Gearvn Sync</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#ec1313",
              "background-light": "#f8f6f6",

          },
        },
      }

    <style>
      body {

      .fill-1 {

        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

        backdrop-filter: blur(20px);

      }
