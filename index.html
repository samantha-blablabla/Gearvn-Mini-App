<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Gearvn Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#ec1313",
              "background-light": "#f8f6f6",
              "background-dark": "#221010",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --app-max-width: 430px;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #111; /* Dark background for desktop */
        margin: 0;
        padding: 0;
        /* Mobile App Feel optimizations */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior-y: none; /* Prevent browser bounce */
      }

      /* Allow text selection only in inputs */
      input, textarea {
        user-select: text;
        -webkit-user-select: text;
      }

      /* Prevent dragging images (app feel) */
      img {
        -webkit-user-drag: none;
        user-drag: none;
        pointer-events: none; /* Let clicks pass through if needed, or just stop drag */
      }

      /* Hide Scrollbar Global */
      ::-webkit-scrollbar {
        display: none;
      }
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .ios-blur {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      
      /* Icon adjustments */
      i[class^="ph"] {
        font-size: 1.5rem;
        display: inline-block;
        vertical-align: middle;
      }
      
      /* App Container Alignment */
      #root {
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
